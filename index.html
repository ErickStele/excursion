<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excursion</title>
  <link rel="stylesheet" href="resources/css/style.css">
</head>
<body>

  <!-- Top header -->
  <header>
    <h1>Excursion</h1>
    <a href="#download">Download</a>
  </header>

  <!-- Video -->
  <section class="video">
    <video src="resources/videos/excursion.mp4" autoplay muted loop playsinline></video>
  </section>

  <!-- Intro text -->
  <section class="intro">
    <h2>Record your adventures</h2>
    <p>Excursion helps you capture every trip, keep your memories in one place, and share them with the people who matter.</p>
  </section>

  <!-- Landscape image -->
  <p class="centered">
    <img src="resources/images/camp.jpg" alt="Tents at a campsite in the mountains">
  </p>

  <!-- App download section -->
  <section class="app" id="download">
    <p class="centered">
      <img src="resources/images/phone.png" alt="Cellphone icon" class="phone">
    </p>
    <h2>Available on iOS and Android</h2>
    <a href="#" class="button">Download</a>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Excursion. All rights reserved.</p>
  </footer>

</body>
</html>
